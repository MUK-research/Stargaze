name: Catalogue snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - tools/refresh_catalog.py
      - .github/workflows/catalog-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public catalogue snapshot
        run: python tools/refresh_catalog.py .build/seed.json
      - name: Render original references
        if: always()
        run: |
          python -m pip install pypdfium2 pillow
          mkdir -p .build/reference
          python - <<'PY'
          import pypdfium2 as pdfium
          doc = pdfium.PdfDocument('Reference/StargazeProjectProposal.pdf')
          for i, page in enumerate(doc):
              page.render(scale=1.5).to_pil().save(f'.build/reference/page-{i+1}.png')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-and-reference-preview
          path: .build/
