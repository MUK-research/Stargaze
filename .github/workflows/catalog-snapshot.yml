name: Catalogue snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - tools/refresh_catalog.py
      - .github/workflows/catalog-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public catalogue snapshot
        run: python tools/refresh_catalog.py build/seed.json
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-snapshot
          path: build/seed.json
