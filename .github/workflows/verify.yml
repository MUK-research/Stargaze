name: Verify prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python API and catalogue tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript geometry, calibration and MIDI tests
        run: npm test
